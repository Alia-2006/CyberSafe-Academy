adow(0 0 28px rgba(56,217,197,.25))}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.sectionhead h2{font-size:32px;margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.course{display:flex;flex-direction:column;gap:14px}.courseicon{font-size:34px}.badge{display:inline-flex;width:max-content;padding:5px 9px;border-radius:999px;background:#132a43;color:#b9d0e9;font-size:12px}.course h3{margin:0;font-size:22px}.course p{line-height:1.6;color:var(--muted);margin:0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.page{min-height:calc(100vh - 72px)}.formwrap{max-width:460px;margin:40px auto}.formwrap h1{font-size:38px;margin-bottom:8px}.field{margin:16px 0}.field label{display:block;margin-bottom:7px;color:#cbd9e7}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--border);background:#081625;color:var(--text);outline:none}.field input:focus{border-color:var(--accent)}.notice{padding:12px 14px;border-radius:10px;margin:12px 0;background:#12273d;color:#bcd0e4}.quizopt{width:100%;text-align:left;padding:14px;border:1px solid var(--border);background:#0b1b2d;color:var(--text);border-radius:12px;margin:8px 0;cursor:pointer}.quizopt.selected{border-color:var(--accent);background:#10363a}.result{font-size:20px;padding:18px;border-radius:14px;background:#102b35;margin-top:18px}.progressbar{height:14px;background:#16273b;border-radius:99px;overflow:hidden}.progressfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}.lessonnav{display:flex;justify-content:space-between;margin-top:28px}.certificate{border:2px solid var(--accent);padding:48px;text-align:center;border-radius:22px;background:linear-gradient(135deg,#0d1b2e,#10243c)}.certificate h1{font-size:42px;margin:8px}.check{color:var(--accent)}@media(max-width:800px){.hero{grid-template-columns:1fr}.grid,.stats{grid-template-columns:1fr}.nav{padding:0 4%;height:auto;min-height:72px}.brand{font-size:17px}.navlinks{gap:4px;flex-wrap:wrap;justify-content:flex-end}.navlinks button{font-size:12px;padding:7px}.container{padding:32px 5%}.shield{min-height:260px}.sectionhead{align-items:flex-start;flex-direction:column}.row{align-items:flex-start}.lessonnav{gap:10px;flex-direction:column}.lessonnav .btn{width:100%}.certificate{padding:30px 18px}.certificate h1{font-size:32px}}

<script>
const courses=[
{id:'awareness',icon:'🛡️',title:'Cybersecurity Awareness',level:'Beginner',modules:4,lessons:8,desc:'Learn the basics of cybersecurity and how to protect yourself from common cyber threats.'},
{id:'passwords',icon:'🔑',title:'Password Security',level:'Beginner',modules:3,lessons:6,desc:'Learn how to create strong passwords and understand common password attacks.'},
{id:'phishing',icon:'🎣',title:'Phishing Awareness',level:'Beginner',modules:3,lessons:6,desc:'Learn how phishing works and how to identify suspicious messages, links, and websites.'},
{id:'web',icon:'🌐',title:'Web Security Basics',level:'Intermediate',modules:4,lessons:8,desc:'Learn the basics of common web vulnerabilities such as SQL Injection and XSS.'}
];
const lessons={awareness:['What is Cybersecurity?','Common Cyber Threats','Strong Passwords','Password Attacks','What is Phishing?','How to Detect Phishing','SQL Injection','XSS'],passwords:['Password Basics','Creating Strong Passwords','Password Managers','Brute Force Attacks','Credential Stuffing','Account Protection'],phishing:['What is Phishing?','Common Phishing Signs','Suspicious Links','Email Phishing','Fake Websites','Phishing Prevention'],web:['Web Security Basics','HTTP & HTTPS','SQL Injection','XSS','Input Validation','Secure Authentication','Session Security','Web Security Review']};
const lessonDisplay={'What is Cybersecurity?':['Cybersecurity Fundamentals','🛡️'],'Common Cyber Threats':['Common Cyber Threats and Attacks','⚠️'],'Strong Passwords':['How to Create Strong Passwords','🔐'],'Password Attacks':['Understanding Password Attacks','🔓'],'What is Phishing?':['Phishing: What It Is','🎣'],'How to Detect Phishing':['How to Spot Phishing','🔎'],'SQL Injection':['SQL Injection Basics','💉'],'XSS':['Cross-Site Scripting (XSS)','🌐'],'Password Basics':['Password Security Basics','🔑'],'Creating Strong Passwords':['Building Strong Passwords','🔐'],'Password Managers':['Using a Password Manager','🗝️'],'Brute Force Attacks':['Brute-Force Password Attacks','🔨'],'Credential Stuffing':['Credential Stuffing Attacks','📋'],'Account Protection':['Protecting Your Accounts','🛡️'],'Common Phishing Signs':['Recognizing Phishing Warning Signs','🚨'],'Suspicious Links':['Identifying Suspicious Links','🔗'],'Email Phishing':['Email Phishing Attacks','📧'],'Fake Websites':['Spotting Fake Websites','🕵️'],'Phishing Prevention':['How to Prevent Phishing','🛡️'],'Web Security Basics':['Web Security Fundamentals','🌐'],'HTTP & HTTPS':['HTTP vs HTTPS','🔒'],'Input Validation':['Input Validation Basics','✅'],'Secure Authentication':['Secure User Authentication','👤'],'Session Security':['Protecting Web Sessions','🍪'],'Web Security Review':['Web Security Review','🔍']};
function lessonName(title){return lessonDisplay[title]?.[0]||title}
function lessonIcon(title){return lessonDisplay[title]?.[1]||'📘'}
function enhanceLessonLabels(){document.querySelectorAll('.row').forEach(row=>{const marker=row.querySelector('span.muted');if(!marker||!/^Lesson \d+$/.test(marker.textContent.trim()))return;const titleBox=marker.nextElementSibling;if(!titleBox)return;const raw=titleBox.textContent.trim().replace(/^✓\s*/,'');if(lessonDisplay[raw]){const done=titleBox.textContent.trim().startsWith('✓');titleBox.innerHTML='<span style="font-size:24px;vertical-align:middle;margin-right:8px">'+lessonIcon(raw)+'</span><span>'+(done?'✓ ':'')+lessonName(raw)+'</span>'}});const h1=document.querySelector('.card h1');if(h1){const raw=h1.textContent.trim();if(lessonDisplay[raw])h1.innerHTML=lessonIcon(raw)+' '+lessonName(raw)}}
function addCourseIntro(){if(document.getElementById('courseIntro'))return;const h2=document.querySelector('.sectionhead h2');if(!h2)return;const c=courses.find(x=>h2.textContent.includes(x.title));if(!c)return;const info={awareness:['Cybersecurity Awareness teaches the essential habits and knowledge needed to stay safer online. You will learn how cyber attacks work and how to protect your accounts, devices, and data.',['Understand common cyber threats','Create stronger passwords and protect accounts','Recognize phishing and suspicious activity','Understand basic web vulnerabilities']],passwords:['Password Security teaches you how to create, manage, and protect passwords against common attacks.',['Build strong and unique passwords','Use password managers safely','Understand brute-force and credential stuffing attacks','Add extra account protection with MFA']],phishing:['Phishing Awareness teaches you how to recognize deceptive emails, messages, links, and fake websites before they cause harm.',['Recognize common phishing warning signs','Check suspicious links and senders','Identify fake websites and messages','Use practical phishing prevention habits']],web:['Web Security Basics introduces important web security concepts and common vulnerabilities in web applications.',['Understand HTTP and HTTPS','Learn SQL Injection and XSS basics','Understand input validation and secure authentication','Learn how to protect web sessions']]}[c.id];const firstCard=document.querySelector('.sectionhead')?.nextElementSibling;if(!firstCard||!info)return;const box=document.createElement('div');box.id='courseIntro';box.className='card';box.style.marginBottom='20px';box.innerHTML='<div class="eyebrow">Before You Start</div><h2 style="margin:8px 0">About This Course</h2><p class="muted" style="line-height:1.8">'+info[0]+'</p><h3>🎯 What You Will Learn</h3><div class="grid" style="margin-top:12px">'+info[1].map((x,i)=>'<div style="padding:14px;border:1px solid var(--border);border-radius:12px;background:#0b1b2d"><span style="font-size:22px">'+['📚','🔐','🛡️','💡'][i]+'</span><strong style="display:block;margin-top:7px">'+x+'</strong></div>').join('')+'</div><div class="notice" style="margin-top:18px"><strong>How the course works:</strong> Complete the lessons in order, answer the Quick Check after each lesson, then take the Final Quiz at the end.</div>';firstCard.parentNode.insertBefore(box,firstCard)}
setInterval(enhanceLessonLabels,500);setInterval(addCourseIntro,500)
const lessonContent={
awareness:{
'What is Cybersecurity?':['Cybersecurity means protecting your devices, accounts, networks, and information from people or software that should not have access. Think of it like locking the doors of a house, but for your digital life. A cyber attack can target your password, files, identity, money, or even a whole organization.',['A strong password protects an account from unauthorized login.','MFA adds another verification step, so a password alone is not enough.','Software updates often fix security weaknesses that attackers could exploit.'],'Imagine receiving a message that asks for your university password. Cybersecurity teaches you to stop, check the sender, and avoid entering the password through an unexpected link.','Start with three habits: update your devices, use unique passwords, and verify unexpected messages.'],
'Common Cyber Threats':['A cyber threat is anything that can take advantage of a weakness to harm a person, device, account, or organization. Common examples include phishing, malware, password attacks, and unsafe websites. The important idea is that attackers often combine technical tricks with human mistakes.',['Phishing tries to trick you into taking an unsafe action.','Malware is malicious software that can damage, spy on, or disrupt systems.','Password attacks try to discover or reuse credentials.'],'For example, an attacker may send a fake delivery message. The message creates urgency, the link opens a fake page, and the victim enters a password. One small action can therefore lead to account compromise.','Slow down when something is unexpected, keep software updated, and use security controls such as MFA.'],
'Strong Passwords':['A strong password should be long, unique, and difficult to guess. The biggest mistake is password reuse: if one website is breached, attackers can try the same password on your other accounts. A password does not need to be complicated to the point that you cannot remember it; a long passphrase can be effective.',['Length makes guessing harder.','Unique means the password is not used on another account.','A password manager can create and store strong unique passwords.'],'Instead of using the same short password everywhere, use a different long passphrase for each important account and let a password manager remember it.','Never use birthdays, names, 123456, or the same password across multiple services.'],
'Password Attacks':['Password attacks are attempts to discover, steal, or reuse credentials. A brute-force attack tries many combinations. Credential stuffing uses credentials leaked from another service. Attackers may also guess predictable information such as names or birthdays.',['Brute force = many password combinations.','Credential stuffing = leaked username/password pairs reused elsewhere.','Password reuse makes one breach more dangerous.'],'If a password was leaked from Website A and you reused it on your email, an attacker may try the leaked password on your email account.','Use unique passwords, MFA, login alerts, and change passwords when a service reports a breach.'],
'What is Phishing?':['Phishing is a social engineering attack. Instead of breaking a system directly, the attacker tries to persuade a person to reveal information, open a link, download a file, or send money. Phishing can arrive through email, SMS, social media, or messaging apps.',['Attackers often impersonate trusted organizations or people.','Urgency and fear are common psychological tricks.','The goal may be a password, payment, personal information, or malware installation.'],'A message saying “Your account will be closed in 10 minutes” is designed to make you act before thinking. The safe response is to stop and verify the request through the official website or app.','Treat unexpected requests for passwords, codes, money, or downloads as something that needs verification.'],
'How to Detect Phishing':['Phishing is easier to detect when you inspect the details instead of trusting the appearance. Look at the sender address, the wording, the requested action, and where a link actually goes. A professional-looking logo does not prove that a message is real.',['Check the complete sender address.','Hover over links when possible and inspect the destination.','Be careful with urgency, threats, unexpected attachments, and requests for secrets.'],'A message may say it is from your bank, but the link could lead to a completely different domain. Open the bank app or type the official address yourself instead of using the message link.','When in doubt, contact the organization using a phone number or website you already trust.'],
'SQL Injection':['SQL Injection is a web application vulnerability that happens when untrusted user input is combined with a database query in an unsafe way. The attacker may be able to change the meaning of the query and access, modify, or delete data.',['User input should be treated as untrusted.','Prepared statements keep data separate from SQL instructions.','Server-side validation provides an additional security layer.'],'If an application builds a query by directly joining text entered into a login box, special SQL characters may change the query itself. A prepared statement prevents the input from being interpreted as SQL code.','For developers: use parameterized queries or prepared statements and validate input on the server.'],
'XSS':['Cross-Site Scripting (XSS) occurs when an application allows untrusted content to be interpreted as executable script in a browser. The attacker may try to steal information, change page content, or perform actions as the victim.',['Stored XSS is saved by the application and shown to other users.','Reflected XSS is returned through a request and reflected into a page.','Output encoding helps prevent data from being interpreted as HTML or script.'],'A comment box should display a user comment as text. If the application inserts unsafe input directly into the page as HTML, an attacker may inject script instead.','Validate input, encode output, avoid unsafe HTML insertion, and use appropriate browser security controls.']},
passwords:{
'Password Basics':['Passwords are an authentication factor: they are used to prove that you are allowed to access an account. A password becomes risky when it is short, predictable, shared, or reused. Your email password is especially important because email can be used to reset other accounts.',['Authentication asks “Who are you?” and “Can you prove it?”','Password reuse connects the security of multiple accounts.','MFA adds an additional factor beyond the password.'],'If the same password protects your email, shopping account, and social media, one stolen password can put all three accounts at risk.','Use a unique password for important accounts, especially email, banking, and university accounts.'],
'Creating Strong Passwords':['The goal of a strong password is to make guessing and automated attacks difficult. Longer passwords or passphrases are generally preferable to short predictable passwords. Avoid information that can be found about you online.',['Use long passwords or passphrases.','Make every important password unique.','Avoid names, birthdays, phone numbers, and common patterns.'],'“Summer2026!” may look complex, but it can still be predictable because it uses a common word and a year. A longer unique passphrase is a better approach.','Use a password manager to generate random passwords when you do not need to memorize them.'],
'Password Managers':['A password manager is a tool that stores passwords securely and can generate unique passwords for different websites. This solves the problem of having to remember dozens of different passwords.',['It can generate random passwords.','It can store credentials so you do not need to reuse passwords.','The master password protects access to the vault.'],'You can have a different random password for your email, university portal, shopping site, and social media without memorizing every password.','Use a strong master password and enable MFA for the password manager when available.'],
'Brute Force Attacks':['A brute-force attack repeatedly tries possible password combinations. Automated tools can make many attempts, so short or predictable passwords are more vulnerable. Services can reduce this risk with rate limiting, lockouts, and MFA.',['Brute force is systematic guessing.','Longer passwords increase the number of possible combinations.','Rate limiting slows repeated login attempts.'],'If a system allows unlimited attempts, an attacker can keep trying passwords. If the system limits attempts and requires MFA, the attack becomes much harder.','Use long unique passwords and enable MFA. Never rely on a short password alone.'],
'Credential Stuffing':['Credential stuffing is different from brute force. Instead of guessing a password, the attacker uses real username/password combinations obtained from a previous breach and tries them on other websites.',['It relies on previously leaked credentials.','Password reuse makes it effective.','It can affect many accounts automatically.'],'If your password was exposed in a breach at one website and you use it somewhere else, attackers may test that same combination on the second service.','Use a different password for every service and change exposed passwords immediately.'],
'Account Protection':['Account protection uses multiple layers. Strong credentials are important, but security improves when you also use MFA, login notifications, recovery options, and device updates.',['MFA adds another authentication factor.','Login alerts can reveal suspicious access quickly.','Recovery information helps you regain control of an account.'],'Even if an attacker learns your password, MFA may require a second factor that they do not have. This is why MFA is especially useful for email and other important accounts.','Enable MFA, review active sessions, keep recovery details updated, and never share verification codes.']},
phishing:{
'What is Phishing?':['Phishing is a deception technique where an attacker pretends to be trustworthy to make you click, download, reveal information, or send money. The attack is successful when the victim believes the story and acts quickly.',['Phishing can arrive by email, SMS, social media, or chat.','Impersonation creates trust.','The attacker usually wants information, access, money, or a malicious download.'],'A fake “account verification” message may send you to a login page controlled by the attacker. The page looks normal, but the credentials go to the attacker.','Do not let urgency replace verification. Use the official app or website instead of the message link.'],
'Common Phishing Signs':['Phishing messages often contain clues. One clue alone does not prove an attack, but several clues together should make you stop and verify.',['Urgent threats such as “act now.”','Unexpected attachments or links.','Requests for passwords, codes, payments, or personal data.','Sender addresses that do not match the claimed organization.'],'A message from “your bank” asks you to confirm your password through a strange domain. The urgent wording plus the unusual domain are strong reasons to stop and verify.','Pause, inspect, and verify using a trusted channel before taking action.'],
'Suspicious Links':['A link can hide its real destination behind text such as “Verify Account.” The destination may use a look-alike domain or a completely unrelated website.',['Read the actual domain carefully.','Be careful with shortened or unexpected links.','When possible, navigate to the service directly instead of clicking the message.'],'A link can display “university.edu” while actually leading somewhere else. The visible words are not enough; the destination matters.','Use official bookmarks or type the trusted website yourself for sensitive logins.'],
'Email Phishing':['Email phishing commonly impersonates a company, teacher, manager, bank, or delivery service. Attackers use realistic branding and urgent stories to make the request seem legitimate.',['Inspect the sender address, not only the display name.','Check whether the request is normal for that organization.','Verify unusual payment or credential requests separately.'],'A message that appears to come from a manager asks for gift cards immediately. Instead of replying, contact the manager through a known phone number or chat.','Never let an email alone authorize a sensitive action. Verify it independently.'],
'Fake Websites':['Fake websites copy real brands to make users trust them. They may copy logos, colors, login forms, and wording. A professional appearance does not prove authenticity.',['Check spelling of the domain.','Look for HTTPS, but remember HTTPS does not make a site trustworthy by itself.','Be cautious of unexpected login pages.'],'An attacker can register a domain that looks similar to a real service. If you enter your password there, the attacker receives it.','For sensitive accounts, start from an official bookmark or the known app instead of a message link.'],
'Phishing Prevention':['Preventing phishing is a combination of awareness and technical controls. No single tool catches every attack, so users should know how to verify requests while organizations use filters, MFA, and monitoring.',['MFA reduces the impact of a stolen password.','Email and browser filters can block some malicious content.','User verification catches attacks that technical tools may miss.'],'Even if a phishing email reaches your inbox, MFA and careful verification can stop the attack from becoming an account takeover.','Use MFA, keep software updated, verify unexpected requests, and report suspicious messages.']},
web:{
'Web Security Basics':['Web security protects websites, web applications, users, and data. A secure application must consider the browser, server, database, authentication, sessions, and the data moving between them.',['HTTPS protects data in transit.','Input validation controls what an application accepts.','Authentication and session security protect user accounts.'],'A shopping website needs to protect login credentials, payment-related information, product data, and user sessions. Security therefore involves many layers, not one feature.','Think in layers: secure communication, safe input handling, secure authentication, protected sessions, and regular testing.'],
'HTTP & HTTPS':['HTTP is the protocol used to transfer web content. HTTPS is HTTP protected with TLS, which helps encrypt data in transit and authenticate the server through certificates.',['HTTP data is not protected by TLS.','HTTPS helps protect data while it travels between browser and server.','HTTPS does not guarantee that the website itself is legitimate.'],'When you log in over HTTPS, the connection is protected against many forms of interception. However, if you visit a fake phishing domain that also uses HTTPS, the connection can still be securely encrypted to the attacker.','Check the domain as well as HTTPS, especially before entering sensitive information.'],
'SQL Injection':['SQL Injection occurs when attacker-controlled input is allowed to change the structure or meaning of a database query. It is usually caused by unsafe construction of SQL statements.',['Never treat user input as trusted SQL code.','Prepared statements separate SQL instructions from data.','Server-side validation adds another layer of defense.'],'A vulnerable application may build a query by concatenating a username directly into SQL. A prepared statement sends the username as data, so SQL characters inside it are not treated as database instructions.','Use prepared statements or parameterized queries and follow secure database access practices.'],
'XSS':['XSS occurs when untrusted content is interpreted as executable script in a browser. The vulnerability is commonly related to unsafe handling of data that is displayed back to users.',['Encode output for the context where it is displayed.','Avoid unsafe HTML insertion when it is not necessary.','Use suitable Content Security Policy and browser protections as additional layers.'],'A comment should appear as text. If the application inserts the comment as raw HTML without safe handling, an attacker may inject script into the page.','Validate input, encode output, and carefully review every place user-controlled content is displayed.'],
'Input Validation':['Input validation checks whether data matches the rules expected by the application. Validation should happen on the server because browser-side checks can be bypassed.',['Check type, length, format, and allowed values.','Reject unexpected data instead of assuming it is safe.','Server-side validation is essential.'],'If a form expects a number between 1 and 10, the server should enforce that rule even if the browser already has an HTML input limit.','Validate every untrusted input according to what the application actually expects.'],
'Secure Authentication':['Authentication verifies a user identity. Secure authentication includes strong credential handling, MFA, safe password storage, and protections against automated login attacks.',['Passwords should be stored using secure password hashing, not plain text.','MFA adds another factor.','Login protections can limit automated attempts.'],'A secure login does not simply compare a plain-text password stored in a database. The application should use an appropriate password-hashing method and verify it safely.','Use strong authentication controls and never store plain-text passwords.'],
'Session Security':['After login, a web application uses a session so the user does not need to authenticate on every page. If an attacker steals a session token, they may be able to act as the user.',['Use secure cookie attributes such as Secure and HttpOnly where appropriate.','Expire sessions and rotate sensitive tokens when needed.','Protect against session fixation and token theft.'],'A user logs in and receives a session cookie. If that token is stolen, an attacker may use it to access the account without knowing the password.','Protect session tokens, use HTTPS, expire sessions appropriately, and avoid exposing tokens in URLs.'],
'Web Security Review':['A web security review looks at the application as a whole: code, configuration, authentication, input handling, sessions, dependencies, and user flows. The goal is to find weaknesses before attackers do.',['Review code and configurations.','Test common vulnerability areas.','Keep frameworks and dependencies updated.','Monitor and fix discovered issues.'],'A review may find that one page validates input correctly while another page does not. Security must be consistent across the application.','Combine secure coding, testing, updates, logging, and regular reviews rather than relying on one security feature.']}
};
const storage={get(k,f){try{const v=localStorage.getItem(k);return v===null?f:v}catch(e){return f}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function safeJSON(value,fallback){try{return JSON.parse(value)}catch(e){return fallback}}
let user=safeJSON(storage.get('cs_user','null'),null); let progress=safeJSON(storage.get('cs_progress','{}'),{}); let quizScores=safeJSON(storage.get('cs_quiz_scores','{}'),{});
if(!user||typeof user!=='object')user=null;if(!progress||typeof progress!=='object'||Array.isArray(progress))progress={};if(!quizScores||typeof quizScores!=='object'||Array.isArray(quizScores))quizScores={};
function save(){storage.set('cs_user',JSON.stringify(user));storage.set('cs_progress',JSON.stringify(progress))}

function interactiveLessonPanel(title,data){const steps=data[1]||[],name=lessonName(title),icon=lessonIcon(title);return `<div class="card" style="margin-top:22px"><div class="eyebrow">✨ Interactive Learning</div><h3>Explore this lesson visually</h3><p class="muted">This interactive summary shows information related only to <strong>${name}</strong>.</p><style>.mini-video{position:relative;background:#06101d;border:1px solid var(--border);border-radius:14px;overflow:hidden}.mini-stage{position:relative;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#174e5a,#06101d 65%)}.mini-scene{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;opacity:0;animation:csScene 24s linear infinite}.mini-scene h4{font-size:28px;margin:0 0 10px}.mini-scene p{margin:0;color:#bcd0e4;line-height:1.75;max-width:620px}.mini-scene:nth-child(1){animation-delay:0s}.mini-scene:nth-child(2){animation-delay:6s}.mini-scene:nth-child(3){animation-delay:12s}.mini-scene:nth-child(4){animation-delay:18s}.mini-icon{font-size:60px;margin-bottom:10px}@keyframes csScene{0%,18%{opacity:1;transform:scale(1)}23%,100%{opacity:0;transform:scale(.96)}}.mini-video.paused .mini-scene{animation-play-state:paused}.mini-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#0b1b2d;border-top:1px solid var(--border)}.mini-controls small{color:var(--muted)}</style><div class="mini-video"><div class="mini-stage"><div class="mini-scene"><div><div class="mini-icon">${icon}</div><h4>${name}</h4><p>${data[0]}</p></div></div><div class="mini-scene"><div><div class="mini-icon">🔍</div><h4>Key Point</h4><p>${steps[0]||'Understand the main idea of this lesson.'}</p></div></div><div class="mini-scene"><div><div class="mini-icon">💡</div><h4>Real-Life Example</h4><p>${data[2]}</p></div></div><div class="mini-scene"><div><div class="mini-icon">🛡️</div><h4>Practical Advice</h4><p>$ function lessonPage(a){const c=courses.find(x=>x.id===a.id),title=lessons[a.id][a.i],content=lessonContent[a.id]?.[title],fallback=['This lesson explains an important cybersecurity concept and how it can affect you in everyday digital activities.',['Understand the main idea.','Recognize how the risk can appear in real situations.','Apply a practical security habit.'],'For example, the same concept can appear when you use email, websites, accounts, or devices.',['Verify unexpected requests, protect your accounts, and keep your software updated.']],data=content||fallback,next=a.i+1<lessons[a.id].length,done=(progress[a.id]||[]).includes(a.i),lq=lessonQuestions[a.id]?.[title];layout(`<div class="card" style="max-width:850px;margin:auto"><div style="font-size:13px;color:var(--muted);margin-bottom:16px"><button class="linkbtn" onclick="go('courses')">Courses</button> → <button class="linkbtn" onclick="go('course','${a.id}')">${c.title}</button> → Lesson ${a.i+1}</div><div class="eyebrow">Lesson ${a.i+1} of ${lessons[a.id].length}</div><h1>${lessonIcon(title)} ${lessonName(title)}</h1><div class="notice"><strong>🎯 What you'll learn</strong><ul style="margin-bottom:0;line-height:1.9"><li>Understand ${lessonName(title)} in simple terms.</li><li>See how the concept can appear in a real situation.</li><li>Learn practical steps to reduce the risk.</li></ul></div><h2 style="margin-top:30px">📖 Lesson Explanation</h2><p class="muted" style="line-height:2;font-size:17px">${data[0]}</p><div class="card" style="margin-top:22px;background:#0a192b"><h3 style="margin-top:0">🔍 Let's understand it step by step</h3><ul style="line-height:2.1;color:var(--muted);padding-left:22px">${data[1].map(x=>'<li>'+x+'</li>').join('')}</ul></div><div class="card" style="margin-top:22px;background:linear-gradient(135deg,#10243c,#0d1b2e)"><div class="eyebrow">Real-Life Example</div><h3>💡 Imagine this situation</h3><p class="muted" style="line-height:2;margin-bottom:0">${data[2]}</p></div><div class="car const lessonQuestions={awareness:{'What is Cybersecurity?':['What is the main goal of cybersecurity?',['Protect systems and data','Make websites faster','Design logos','Write games'],0],'Common Cyber Threats':['Which is a common cyber threat?',['Phishing','Screen brightness','Battery charging','Printing'],0],'Strong Passwords':['Which is a strong password practice?',['Reuse one password','Use a unique long password','Share your password','Use your birthday'],1],'Password Attacks':['What does a brute force attack do?',['Tries many possible passwords','Blocks all websites','Updates software','Encrypts every file'],0],'What is Phishing?':['What is phishing?',['A social engineering attack','A backup method','A firewall','A programming language'],0],'How to Detect Phishing':['Which can be a phishing warning sign?',['Urgent unexpected request','A saved bookmark','An offline file','A normal software update'],0],'SQL Injection':['What does SQL Injection target?',['Database queries','Monitor settings','Keyboard drivers','Battery life'],0],'XSS':['What does XSS involve?',['Untrusted script executing in a browser','Strong password creation','Disk formatting','Wi-Fi setup'],0]},passwords:{'Password Basics':['Why are unique passwords important?',['They reduce damage from password reuse','They make Wi-Fi faster','They remove malware','They increase screen size'],0],'Creating Strong Passwords':['Which is generally stronger?',['A long unique passphrase','A short common word','Your name','12345678'],0],'Password Managers':['What can a password manager do?',['Store and generate unique passwords','Repair hardware','Block all phishing','Replace the operating system'],0],'Brute Force Attacks':['What is brute force?',['Repeatedly trying password combinations','Sending newsletters','Backing up files','Scanning QR codes'],0],'Credential Stuffing':['What is credential stuffing?',['Using leaked credentials on other sites','Creating strong passwords','Encrypting a disk','Updating a browser'],0],'Account Protection':['Which adds a layer of account protection?',['MFA','Password sharing','Password reuse','Unknown links'],0]},phishing:{'What is Phishing?':['Phishing tries to trick users into doing what?',['Revealing information or taking an unsafe action','Updating a printer','Charging a phone','Changing screen brightness'],0],'Common Phishing Signs':['Which is a common phishing sign?',['Unexpected urgency','A trusted bookmark','An offline document','A normal update'],0],'Suspicious Links':['What should you do before opening a suspicious link?',['Verify the destination','Enter your password','Forward it to everyone','Disable security tools'],0],'Email Phishing':['What should you inspect in a suspicious email?',['The sender address','Your wallpaper','Battery level','Screen resolution'],0],'Fake Websites':['What should you check on a login website?',['The domain carefully','The page color only','The number of images','The font size'],0],'Phishing Prevention':['Which helps prevent phishing?',['MFA and verification','Password reuse','Clicking urgent links','Sharing credentials'],0]},web:{'Web Security Basics':['What does web security protect?',['Web applications, users, and data','Only keyboards','Only printers','Only batteries'],0],'HTTP & HTTPS':['What does HTTPS add to HTTP?',['TLS protection for data in transit','More screen brightness','A stronger keyboard','Extra storage'],0],'SQL Injection':['What should developers use to help prevent SQL Injection?',['Prepared statements','Plain string concatenation','Shared passwords','Unknown scripts'],0],'XSS':['What can help prevent XSS?',['Output encoding','Password reuse','Disabling updates','Sharing session tokens'],0],'Input Validation':['What is input validation?',['Checking submitted data against expected rules','Changing screen colors','Encrypting every image','Deleting user accounts'],0],'Secure Authentication':['Which is a useful authentication control?',['MFA','Password sharing','Reused passwords','Unknown links'],0],'Session Security':['Which helps protect sessions?',['Secure cookies and expiration','Sharing session tokens','Permanent sessions','Disabling HTTPS'],0],'Web Security Review':['Why perform security reviews?',['To find and fix weaknesses','To increase screen size','To remove all users','To disable logging'],0]}};

   else if(nextCourse) nextBox='<div style="margin-top:18px"><strong>✅ Course completed!</strong><br><button class="btn primary" style="margin-top:12px" onclick="go(\'course\',\''+nextCourse.id+'\')">Continue to '+nextCourse.title+' →</button></div>';
 }
 document.getElementById('quizresult').innerHTML='<div class="result">'+(pct>=60?'🎉':'📚')+' Score: <strong>'+score+' / '+qs.length+'</strong> — '+pct+'%<br><span class="muted">'+(pct>=60?'Great job! You passed this quiz and your progress is updated.':'Review the lessons and try again. You need 60% or more to pass.')+'</span>'+nextBox+'</div>';
}
function progressPage(){let total=Object.values(lessons).reduce((n,a)=>n+a.length,0),done=Object.entries(progress).reduce((n,[id,a])=>n+Math.min(a.length,lessons[id].length),0),pct=Math.round(done/total*100);layout(`<div class="sectionhead"><div><div class="eyebrow">Your learning</div><h2>Course Progress</h2><p class="muted">${done} of ${total} lessons completed</p></div><strong style="font-size:28px">${pct}%</strong></div><div class="progressbar"><div class="progressfill" style="width:${pct}%"></div></div><div class="grid" style="margin-top:24px">${courses.map(c=>{let d=(progress[c.id]||[]).length,p=Math.round(d/c.lessons*100),next=lessons[c.id].findIndex((_,i)=>!(progress[c.id]||[]).includes(i));return `<div class="card"><div class="row"><strong>${c.icon} ${c.title}</strong><span>${p}%</span></div><div class="progressbar" style="margin:14px 0"><div class="progressfill" style="width:${p}%"></div></div><span class="muted">${d}/${c.lessons} lessons ${quizScores[c.id]!==undefined?'• Quiz: '+quizScores[c.id]+'%':''}</span><div style="margin-top:14px"><button class="btn secondary" onclick="go('lesson',{id:'${c.id}',i:${next<0?0:next}})">${next<0?'Review Course':'Continue Learning →'}</button></div></div>`}).join('')}</div>`)}
function certificatePage(){
 const passed=courses.every(c=>Number(quizScores[c.id])>=60);
 let status='';
 if(passed){
   status='<p class="check"><strong>✓ Course requirements completed</strong></p><button class="btn primary" style="margin-top:14px" onclick="window.print()">🖨️ Print Certificate</button>';
 }else{
   status='<p class="muted">Finish every course and pass each Final Quiz with at least 60%.</p><div class="grid" style="margin-top:20px">';
   status+=courses.map(c=>'<div class="card" style="text-align:left"><strong>'+c.icon+' '+c.title+'</strong><div class="muted" style="margin-top:7px">Lessons: '+(progress[c.id]||[]).length+'/'+lessons[c.id].length+'</div><div class="muted">Final Quiz: '+(quizScores[c.id]===undefined?'Not taken':quizScores[c.id]+'%')+'</div></div>').join('');
   status+='</div><button class="btn secondary" style="margin-top:18px" onclick="go(\'courses\')">Continue Learning</button>';
 }
 layout('<div class="certificate"><div class="eyebrow">CyberSafe Academy</div><h1>Certificate of Completion</h1><p class="muted">This certificate is awarded to</p><h2>'+((user&&user.name)||'Student Name')+'</h2><p class="muted">for completing the Cybersecurity learning pathway.</p><div style="font-size:50px;margin:22px">🏆</div>'+status+'</div>');
}
function dashboard(){let active=courses.find(c=>(progress[c.id]||[]).length>0&&((progress[c.id]||[]).length<c.lessons))||courses.find(c=>(progress[c.id]||[]).length===0),d=active?(progress[active.id]||[]).length:0,next=active?lessons[active.id].findIndex((_,i)=>!((progress[active.id]||[]).includes(i))):-1,p=active?Math.round(d/active.lessons*100):100,action=active&&next>=0?"go('lesson',{id:'"+active.id+"',i:"+next+"})":"go('courses')";layout(`<div class="sectionhead"><div><div class="eyebrow">Your dashboard</div><h2>Welcome back, ${user.name} 👋</h2><p class="muted">Continue learning from where you left off.</p></div><button class="btn secondary" onclick="go('courses')">Browse Courses</button></div><div class="card" style="margin-bottom:20px"><div class="row"><div><div class="eyebrow">Continue Learning</div><h2 style="margin:6px 0">${active?active.icon+' '+active.title:'All courses completed 🎉'}</h2><span class="muted">${active&&next>=0?'Next: Lesson '+(next+1)+' — '+lessons[active.id][next]:'You have completed your current learning path.'}</span></div><button class="btn primary" onclick="${action}">${active&&next>=0?'Continue Learning →':'Explore More Courses'}</button></div>${active?'<div class="progressbar" style="margin-top:18px"><div class="progressfill" style="width:'+p+'%"></div></div><div class="muted" style="margin-top:8px">'+d+'/'+active.lessons+' lessons completed • '+p+'%</div>':''}</div><h2>My Courses</h2><div class="grid">${courses.map(c=>{let cd=(progress[c.id]||[]).length,cp=Math.round(cd/c.lessons*100);return `<div class="card"><div class="row"><strong>${c.icon} ${c.title}</strong><span>${cp}%</span></div><div class="progressbar" style="margin:14px 0"><div class="progressfill" style="width:${cp}%"></div></div><div class="muted">${cd}/${c.lessons} lessons completed</div><button class="btn secondary" style="margin-top:14px" onclick="go('course','${c.id}')">${cd?'Continue':'Start Course'}</button></div>`}).join('')}</div>`)}
try{if(user) dashboard(); else home()}catch(e){document.getElementById('app').innerHTML='<div class="container"><div class="card" style="max-width:700px;margin:70px auto;text-align:center"><div style="font-size:54px">🛡️</div><h1>CyberSafe Academy</h1><p class="muted" style="line-height:1.8">The academy could not restore the previous session. You can start again safely.</p><button class="btn primary" onclick="localStorage.removeItem(\'cs_user\');localStorage.removeItem(\'cs_progress\');localStorage.removeItem(\'cs_quiz_scores\');location.reload()">Start Again</button></div></div>'}
</script></body></html>
